<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>qafila</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      border: 1px solid #000;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="pdf-canvas"></canvas>
  </div>

  <!-- Carica PDF.js dalla CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
  <script>
    const url = 'https://shayan2108.github.io/shayan/nmz.pdf'; // Il link al tuo PDF
    const pageNumber = 4; // La pagina che vuoi visualizzare

    // Carica il PDF
    pdfjsLib.getDocument(url).promise.then(pdf => {
      // Carica la pagina desiderata
      pdf.getPage(pageNumber).then(page => {
        const scale = 1.5; // Modifica questo valore per ingrandire/ridurre il PDF
        const viewport = page.getViewport({ scale: scale });

        const canvas = document.getElementById('pdf-canvas');
        const context = canvas.getContext('2d');

        // Imposta le dimensioni del canvas in base alla pagina
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        // Disegna la pagina sul canvas
        page.render({
          canvasContext: context,
          viewport: viewport
        });
      });
    });
  </script>
</body>
</html>
